services:
  postgres:
    image: postgres:16
    container_name: expoapp-postgres
    environment:
      POSTGRES_USER: expoapp
      POSTGRES_PASSWORD: expoapp
      POSTGRES_DB: expoapp
    ports:
      - "5433:5432"
    volumes:
      - expoapp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expoapp -d expoapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: expoapp-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expoapp-postgres-data:
